<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - JobmAIker</title>
    <link rel="icon" type="image/png" href="icons/favicon.png">
    <link rel="stylesheet" href="Styles/style.css">
</head>
<body>

    <div class="container">

        <div class="left">
            <div class="logo">
                <a href="/home" title="Go to Landing Page" style="display: inline-block; cursor: pointer; text-decoration: none;">
                    <img src="icons/jobmaiker2.png" alt="JobmAIker Logo" style="cursor: pointer; height: 52px; width: auto;">
                </a>
            </div>
            
            <h2>Welcome Back</h2>
            <p class="auth-subtitle">Sign in to access your JobmAIker career dashboard</p>

            <!-- Server-Side Flash/Message Alert -->
            {% if message %}
            <div class="alert {% if message_type == 'success' or 'success' in message.lower() %}alert-success{% else %}alert-danger{% endif %}">
                {% if message_type == 'success' or 'success' in message.lower() %}
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                    <polyline points="22 4 12 14.01 9 11.01"></polyline>
                </svg>
                {% else %}
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
                {% endif %}
                <span>{{ message }}</span>
            </div>
            {% endif %}

            <!-- Client-Side Alert Box -->
            <div id="alert-box" class="alert alert-danger" style="display: none;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
                <span id="alert-text"></span>
            </div>

            <form action="/login" method="post" id="login-form">

                <label for="login-identifier">Email or Username</label>
                <input 
                    type="text" 
                    id="login-identifier" 
                    name="email" 
                    placeholder="Enter email or username" 
                    value="{{ email or '' }}" 
                    required 
                    autofocus
                >

                <label for="login-password">Password</label>
                <div class="password-wrapper">
                    <input 
                        type="password" 
                        id="login-password" 
                        name="password" 
                        placeholder="Enter password" 
                        required
                    >
                    <button type="button" class="toggle-password" id="toggle-pwd-btn" aria-label="Toggle password visibility" title="Show/Hide Password">
                        <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>

                <button type="submit" id="login-submit-btn">
                    <span id="btn-text">Sign In</span>
                </button>

                <p class="register-text">
                    Don't have an account?
                    <a href="/register">Sign Up</a>
                </p>

                <div class="back-home-box">
                    <a href="/home">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="19" y1="12" x2="5" y2="12"></line>
                            <polyline points="12 19 5 12 12 5"></polyline>
                        </svg>
                        Back to Home Page
                    </a>
                </div>

            </form>

        </div>

        <div class="right">
            <img src="icons/login.png" alt="JobmAIker Login Preview">
        </div>

    </div>

    <script>
        // Password Visibility Toggle
        const toggleBtn = document.getElementById("toggle-pwd-btn");
        const passwordInput = document.getElementById("login-password");
        const eyeIcon = document.getElementById("eye-icon");

        if (toggleBtn && passwordInput) {
            toggleBtn.addEventListener("click", () => {
                const isPassword = passwordInput.getAttribute("type") === "password";
                passwordInput.setAttribute("type", isPassword ? "text" : "password");
                
                // Toggle Eye Icon SVG
                if (isPassword) {
                    eyeIcon.innerHTML = `
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                        <line x1="1" y1="1" x2="23" y2="23"></line>
                    `;
                } else {
                    eyeIcon.innerHTML = `
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    `;
                }
            });
        }

        // Query parameter alerts
        const urlParams = new URLSearchParams(window.location.search);
        const alertBox = document.getElementById("alert-box");
        const alertText = document.getElementById("alert-text");

        if (urlParams.get("registered") === "1") {
            alertBox.className = "alert alert-success";
            alertBox.style.display = "flex";
            alertText.textContent = "Account registered successfully! Please sign in with your credentials.";
        } else if (urlParams.get("logout") === "1") {
            alertBox.className = "alert alert-info";
            alertBox.style.display = "flex";
            alertText.textContent = "You have been logged out successfully.";
        }

        // Form submission loading indicator
        const loginForm = document.getElementById("login-form");
        const submitBtn = document.getElementById("login-submit-btn");
        const btnText = document.getElementById("btn-text");

        if (loginForm && submitBtn) {
            loginForm.addEventListener("submit", () => {
                submitBtn.disabled = true;
                btnText.innerHTML = `<span class="spinner"></span> Signing In...`;
            });
        }
    </script>

</body>
</html>
