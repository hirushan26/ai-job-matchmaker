<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - JobmAIker</title>
    <link rel="icon" type="image/png" href="icons/favicon.png">
    <link rel="stylesheet" href="Styles/style.css">
</head>
<body>
    <div class="container">

        <div class="left">
            <div class="logo">
                <a href="/home" title="Go to Landing Page" style="display: inline-block; cursor: pointer; text-decoration: none;">
                    <img src="icons/jobmaiker2.png" alt="JobmAIker Logo" style="cursor: pointer; height: 52px; width: auto;">
                </a>
            </div>
            
            <h2>Create Account</h2>
            <p class="auth-subtitle">Join JobmAIker to unlock smart AI career matches</p>

            <!-- Server-Side Flash/Message Alert -->
            {% if message %}
            <div class="alert {% if message_type == 'success' or 'success' in message.lower() %}alert-success{% else %}alert-danger{% endif %}">
                {% if message_type == 'success' or 'success' in message.lower() %}
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                    <polyline points="22 4 12 14.01 9 11.01"></polyline>
                </svg>
                {% else %}
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
                {% endif %}
                <span>{{ message }}</span>
            </div>
            {% endif %}

            <!-- Client-Side Alert Box -->
            <div id="alert-box" class="alert alert-danger" style="display: none;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
                <span id="alert-text"></span>
            </div>

            <form action="/register" method="post" id="register-form">

                <label for="fullname">Full Name</label>
                <input 
                    type="text" 
                    name="name" 
                    id="fullname" 
                    placeholder="Enter Full Name" 
                    value="{{ name or '' }}" 
                    required 
                    autofocus
                >
                
                <label for="email">Email Address</label>
                <input 
                    type="email" 
                    name="email" 
                    id="email" 
                    placeholder="Enter Email Address" 
                    value="{{ email or '' }}" 
                    required
                >

                <label for="password">Password</label>
                <div class="password-wrapper">
                    <input 
                        type="password" 
                        name="password" 
                        id="password" 
                        placeholder="Create Password (min. 4 characters)" 
                        required
                    >
                    <button type="button" class="toggle-password" id="toggle-pwd-btn-1" aria-label="Toggle password visibility" title="Show/Hide Password">
                        <svg id="eye-icon-1" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>

                <label for="confirmPassword">Confirm Password</label>
                <div class="password-wrapper">
                    <input 
                        type="password" 
                        name="confirmPassword" 
                        id="confirmPassword" 
                        placeholder="Confirm Password" 
                        required
                    >
                    <button type="button" class="toggle-password" id="toggle-pwd-btn-2" aria-label="Toggle password visibility" title="Show/Hide Password">
                        <svg id="eye-icon-2" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>

                <button type="submit" id="register-submit-btn">
                    <span id="btn-text">Register Account</span>
                </button>

                <p class="register-text">
                    Already have an account?
                    <a href="/login">Sign In</a>
                </p>

                <div class="back-home-box">
                    <a href="/home">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="19" y1="12" x2="5" y2="12"></line>
                            <polyline points="12 19 5 12 12 5"></polyline>
                        </svg>
                        Back to Home Page
                    </a>
                </div>

            </form>

        </div>

        <div class="right">
            <img src="icons/login.png" alt="JobmAIker Registration Preview">
        </div>

    </div>

    <script>
        // Password toggles helper
        function setupToggle(btnId, inputId, iconId) {
            const btn = document.getElementById(btnId);
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (!btn || !input) return;

            btn.addEventListener("click", () => {
                const isPassword = input.getAttribute("type") === "password";
                input.setAttribute("type", isPassword ? "text" : "password");
                if (isPassword) {
                    icon.innerHTML = `
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                        <line x1="1" y1="1" x2="23" y2="23"></line>
                    `;
                } else {
                    icon.innerHTML = `
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    `;
                }
            });
        }

        setupToggle("toggle-pwd-btn-1", "password", "eye-icon-1");
        setupToggle("toggle-pwd-btn-2", "confirmPassword", "eye-icon-2");

        // Client-side Validation before submission
        const form = document.getElementById("register-form");
        const submitBtn = document.getElementById("register-submit-btn");
        const btnText = document.getElementById("btn-text");
        const alertBox = document.getElementById("alert-box");
        const alertText = document.getElementById("alert-text");

        form.addEventListener("submit", (e) => {
            const pwd = document.getElementById("password").value;
            const confirmPwd = document.getElementById("confirmPassword").value;

            if (pwd !== confirmPwd) {
                e.preventDefault();
                alertBox.className = "alert alert-danger";
                alertBox.style.display = "flex";
                alertText.textContent = "Passwords do not match. Please re-enter.";
                document.getElementById("confirmPassword").focus();
                return;
            }

            if (pwd.length < 4) {
                e.preventDefault();
                alertBox.className = "alert alert-danger";
                alertBox.style.display = "flex";
                alertText.textContent = "Password must be at least 4 characters long.";
                document.getElementById("password").focus();
                return;
            }

            // Hide alert and show loading state
            alertBox.style.display = "none";
            submitBtn.disabled = true;
            btnText.innerHTML = `<span class="spinner"></span> Creating Account...`;
        });
    </script>

</body>
</html>
